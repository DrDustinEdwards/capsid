name: checks

# Every pull request check in one job: devkit's pr.yml runs the footer strip, the trailer check, the shared-code check,
# OSV-Scanner, actionlint and zizmor when .github/ changes, the no-bloat ratchet, the Worker bundle size and the reviewer,
# with one checkout and one install (devkit README, "One job per pull request"). Exceptions to the shared-code check are
# in .shared.json with their reasons. What is shared: https://github.com/DrDustinEdwards/devkit/blob/shared-list/SHARED.md
# Run it by hand once to clean the footer from every past pull request.
#
# No push to master: the merge was checked as a pull request (devkit README, "No second run on main"). The job id is
# `checks`, so the check is "checks / Repo checks", the name the ruleset requires.

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  merge_group:
  # Once a day on the default branch: the shared-code check judges the repository's state there, which a pull request's
  # run leaves to it (devkit pr.yml, "THE CALLER"). A red run is Capsid's job for this repository.
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# The pull request is the group, so a newer push cancels the older run.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    # A called workflow holds no more than this job grants: the footer writes the description, the reviewer signs in to
    # Capsid with the job's OIDC token (src/review.ts admits pr.yml) and writes its check.
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      checks: write
    uses: DrDustinEdwards/devkit/.github/workflows/pr.yml@90efbee8e78a1b07b334d5058d19cb0e2a9828d0 # v0.48.0
    with:
      review: true
      # The three installs: the knip (dashboard) run reads dashboard/, its own package, and the Worker bundles the Portal's
      # pages from it; devkit-css-vars (.css-vars.json) reads the Capsomer package each of dashboard/ and explorer/ pins.
      install: npm ci && npm ci --prefix dashboard && npm ci --prefix explorer
      # The Worker bundle size (.worker-size.json, set about 10% above the measured Total Upload). The Worker renders the
      # Portal's pages (dashboard/build/worker/portal.js, bundled in through the capsid-portal-pages alias), so the
      # dashboard is built first; the dry run reads wrangler.dryrun.jsonc, which scripts/dry-run-config.mjs builds offline
      # from wrangler.jsonc.example, so no secret is needed. Raised on 2026-11-03 from 1872 KiB raw and 540 KiB gzip to
      # 2885 and 850 (Dustin: the Portal rendered on the server like the network's other sites). Raised on 2026-11-11 to
      # 3216 and 955 (10% above 2924 and 868): the Public Suffix List for registrableDomain (tldts, 129 KiB raw, 46 KiB gzip).
      worker-size-prepare: npm --prefix dashboard run build && node scripts/dry-run-config.mjs
