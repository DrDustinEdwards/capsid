name: family

# devkit's family check: pins behind the newest release, local copies of shared code, a family feature this site lacks,
# and British spelling. Exceptions are in .family.json with their reasons. What is shared:
# https://github.com/DrDustinEdwards/devkit/blob/shared-list/SHARED.md

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: family-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  family:
    uses: DrDustinEdwards/devkit/.github/workflows/family.yml@db347b70932b52b427b120ee1419d4614d5e4c29 # v0.20.20
