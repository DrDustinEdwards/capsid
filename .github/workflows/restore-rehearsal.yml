# The restore rehearsal. Weekly and on demand: pull the newest JSON dump from R2 with a
# minted one-hour credential, check what only Capsid knows about its dump
# (scripts/dump-invariants.mjs), then run d1-dump's restore drill on it: restore into a
# local SQLite database, check counts against the marker, FTS5 agreement and a search,
# and delete the scratch database. It fails loudly when a dump cannot be rebuilt.
#
# The pull uses the SAME /backup/credential mint as the off-account mirror, signed with
# BACKUP_CREDENTIAL_KEY, so that secret belongs on capsid-mcp as well as
# capsid-backups. The pull reads only the newest run (object-read-only) and never writes.
# The drill restores into a node:sqlite file and holds no Cloudflare credential: a D1
# Edit token covers every database in the account, so none belongs in scheduled CI on a
# public repo (Dustin, 2026-10-05). The drill against a real D1 database is run by hand.
name: restore-rehearsal
on:
  schedule:
    - cron: "30 11 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rehearse:
    runs-on: ubuntu-latest
    # A hung aws sync or a wedged drill would otherwise run to GitHub's 360-minute
    # default while holding a secret. The rehearsal downloads one dump and restores it
    # into one scratch database.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      # @dustinedwards/d1-dump, which carries the drill, is a dependency.
      - run: npm ci

      - name: Mint a credential and pull the newest dump
        id: pull
        env:
          BACKUP_CREDENTIAL_KEY: ${{ secrets.BACKUP_CREDENTIAL_KEY }}
          CAPSID_URL: https://mcp.dustinedwards.info
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_CREDENTIAL_KEY}" ]; then
            echo "BACKUP_CREDENTIAL_KEY is not set on this repo; derive it with scripts/improve-derive-key.mjs --backup-credential" >&2
            exit 1
          fi
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BODY=$(node -e 'process.stdout.write(JSON.stringify({ jti: require("crypto").randomUUID() }))')
          SIG=$(TS="${TS}" BODY="${BODY}" node -e 'const c=require("crypto");const h=c.createHmac("sha256",process.env.BACKUP_CREDENTIAL_KEY);h.update(process.env.TS+"."+process.env.BODY);process.stdout.write(h.digest("hex"))')
          CRED_FILE=$(mktemp)
          STATUS=$(/usr/bin/curl --silent --show-error -o "${CRED_FILE}" -w '%{http_code}' \
            -X POST "${CAPSID_URL}/backup/credential" \
            -H "Content-Type: application/json" \
            -H "X-Backup-Timestamp: ${TS}" \
            -H "X-Backup-Signature: ${SIG}" \
            --data "${BODY}")
          if [ "${STATUS}" != "200" ]; then
            echo "backup credential request failed (HTTP ${STATUS}):" >&2
            cat "${CRED_FILE}" >&2
            exit 1
          fi
          # One field per call, assigned and then exported. No eval: `eval "$(node ...)"`
          # discarded node's exit status, so a missing field went unnoticed, and it
          # expanded any $ or backtick inside a credential value. `export X=$(...)` would
          # also discard the status, which is why assignment and export are separate.
          cred() {
            CRED_FILE="${CRED_FILE}" FIELD="$1" node -e '
              const c = JSON.parse(require("fs").readFileSync(process.env.CRED_FILE, "utf8"));
              const v = c[process.env.FIELD];
              if (typeof v !== "string" || !v) { console.error("missing " + process.env.FIELD + " in the credential response"); process.exit(1); }
              process.stdout.write(v);'
          }
          AWS_ACCESS_KEY_ID=$(cred access_key_id)
          AWS_SECRET_ACCESS_KEY=$(cred secret_access_key)
          AWS_SESSION_TOKEN=$(cred session_token)
          DUMP_ENDPOINT=$(cred endpoint)
          DUMP_BUCKET=$(cred bucket)
          DUMP_PREFIX=$(cred prefix)
          export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN DUMP_ENDPOINT DUMP_BUCKET DUMP_PREFIX
          # The newest run is the last prefix lexically (the keys carry an ISO
          # timestamp at a fixed offset). List one level, take the last, sync it.
          NEWEST=$(aws s3 ls "s3://${DUMP_BUCKET}/${DUMP_PREFIX}" --endpoint-url "${DUMP_ENDPOINT}" | awk '/PRE/{print $2}' | sort | tail -1)
          if [ -z "${NEWEST}" ]; then
            echo "no run prefixes under ${DUMP_PREFIX}; nothing to rehearse" >&2
            exit 1
          fi
          echo "newest run: ${NEWEST}"
          # Laid out as the keys are (dump/backups/json/<run>/<table>.json), which is the
          # shape d1-dump's drill reads from a directory.
          mkdir -p "dump/${DUMP_PREFIX}${NEWEST}"
          aws s3 sync "s3://${DUMP_BUCKET}/${DUMP_PREFIX}${NEWEST}" "dump/${DUMP_PREFIX}${NEWEST}" --endpoint-url "${DUMP_ENDPOINT}"
          echo "run_prefix=${DUMP_PREFIX}${NEWEST}" >> "${GITHUB_OUTPUT}"

      # What only Capsid knows about its dump: the marker lists every file, both sidecars
      # are present, documents is not empty, and the tables describe one instant.
      - name: Check the dump's own invariants
        run: node scripts/dump-invariants.mjs "dump/${{ steps.pull.outputs.run_prefix }}"

      # Fails when the dump is older than 26 hours: the newest prefix is whatever the
      # last successful backup wrote, so without that check a stopped backup keeps this
      # green. Also fails on a count that differs from the marker, an FTS5 index that
      # disagrees with its content table, a search that finds nothing, a statement over
      # the 100,000 byte statement cap, and a scratch database it could not delete.
      # --backend sqlite is explicit, so adding Cloudflare variables to this job later
      # cannot switch the drill to a real D1 database.
      - name: Restore into a scratch SQLite database and check it
        env:
          RUN_PREFIX: ${{ steps.pull.outputs.run_prefix }}
        run: npx d1-dump drill --dir dump --prefix "${RUN_PREFIX}" --backend sqlite
