name: no-bloat

# THE NO-BLOAT RATCHET: Knip on the Worker and the dashboard, and jscpd over the source, against
# the baseline in .no-bloat.json (devkit's reusable workflow and its devkit-no-bloat bin). A count
# above its baseline fails the run; after a cut, lower it with `npx devkit-no-bloat --write-baseline`.
# Page weight stays in ci.yml's dashboard build step.
#
# A reusable workflow is pinned by full sha like any action (test/workflow-policy.test.ts),
# and it declares its own timeout.

on:
  # A public repository: every pull request and every push to the default branch.
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: no-bloat-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  no-bloat:
    uses: DrDustinEdwards/devkit/.github/workflows/no-bloat.yml@d92c2d87a1d14fa059cd256fa6b011fde8666f96 # v0.8.0
    with:
      # The knip (dashboard) run reads dashboard/, its own package.
      install: npm ci && npm ci --prefix dashboard
