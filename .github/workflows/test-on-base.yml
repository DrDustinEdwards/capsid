name: test-on-base

# TEST ON THE BASE (docs/work-queue.md, "CI on complete"; scripts/test-on-base.mjs). A job
# whose body has a TEST ON BASE line opts in, and its session labels the pull request
# test-on-base. The pull request's test changes alone are laid on the base: at least one
# of its tests must fail there, and every one that did must pass on the head. Capsid's
# complete then needs this job's check run to have passed. Unlabelled pull requests skip
# it, and a skipped run fails nothing.

on:
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: test-on-base-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-on-base:
    name: test-on-base
    if: contains(github.event.pull_request.labels.*.name, 'test-on-base')
    runs-on: ubuntu-latest
    # About four times a local run of two test files on each side.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the pull request's tests on the base and on the head
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/test-on-base.mjs "$BASE_SHA" "$HEAD_SHA"
