name: Mutation baseline

# THE TEST-SUITE AUDIT'S MEASUREMENT (job_bbf8db13c57b, Dustin 2026-10-03, capsid/decisions.md
# "tests are part of no-bloat, and heavy suites run in CI"). StrykerJS mutates src/ and
# reports, per mutant, which test files killed it. A test file is a candidate for deletion
# only when every mutant it kills is also killed by a file that stays, so the report this
# produces is the evidence, and nothing is deleted from it automatically.
#
# Manual only. It is not a gate and runs on no schedule: a full run is hours of runner time,
# which the public repo's free minutes cover but a push trigger would spend on every commit.
#
# STRYKER IS NOT A DEPENDENCY OF THIS REPO. It is installed here with --no-save after
# `npm ci`, so package.json and package-lock.json stay as reviewed (adding it to the lockfile
# moved about a hundred transitive entries). --ignore-scripts because nothing it needs runs
# an install script. The unit suite only: the integration suite runs in workerd, which
# Stryker's runners cannot drive, so integration tests are outside this measurement and
# are kept (the ruling keeps the real-runtime tests regardless).
#
# Sharded by source file so one job stays far under GitHub's six hour limit. Each shard
# runs the whole unit suite once as its dry run, then only its own mutants.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutate:
    name: shard ${{ matrix.shard }} of 8
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Stryker without touching the lockfile
        run: npm install --no-save --no-package-lock --ignore-scripts @stryker-mutator/core@10.0.0 @stryker-mutator/tap-runner@10.0.0

      - name: Mutate this shard's source files
        run: |
          set -euo pipefail
          # Every non-declaration source file, sorted, dealt out round-robin so each shard
          # gets a mix of large and small files. The count is printed so a glob that
          # matched nothing cannot pass as an empty run.
          #
          # Files that call server.registerTool( are left out of the run. test/tool-annotations,
          # test/invariants, test/blast-radius and test/mutation-guard-coverage read the tool
          # modules' source text, and Stryker's instrumentation rewrites it, so the dry run
          # fails whenever one of them is instrumented. No test is excluded.
          #
          # The same holds for every file below. Each is read as text by the test named
          # beside it (found by running every test file in an instrumented sandbox, which
          # is the dry run's own condition), so instrumenting it fails that test. They are
          # left out of the mutate list; the tests still run and still count.
          #   src/index.ts            test/admin-client-audit, test/deploy-pipeline, test/improve-cron
          #   src/server.ts           test/admin-client-audit
          #   src/routes.ts           test/route-gates, test/source-conventions
          #   src/auth.ts             test/source-conventions (timingSafeEqual compare)
          #   src/access-login.ts     test/source-conventions (timingSafeEqual compare)
          #   src/skills-refresh.ts   test/skills-refresh (MODEL_ID pattern)
          #   src/tool-annotations.ts test/tool-annotations (TOOL_HINTS table)
          # src/access-jwt.ts is a different case: Stryker's Babel parser rejects a typed
          # arrow function under a computed key there ("Did not expect a type annotation"),
          # so the whole run stops before any test. It is left out until that is fixed.
          # A file listed here that no longer exists is harmless; one removed from the list
          # fails the dry run loudly if a test still reads it.
          cat > excluded-files.txt <<'EXCLUDED'
          src/access-jwt.ts
          src/access-login.ts
          src/auth.ts
          src/index.ts
          src/routes.ts
          src/server.ts
          src/skills-refresh.ts
          src/tool-annotations.ts
          EXCLUDED
          find src -name '*.ts' ! -name '*.d.ts' | sort | xargs grep -LF 'server.registerTool(' | grep -vxF -f excluded-files.txt > all-files.txt
          total=$(wc -l < all-files.txt)
          awk -v s="${{ matrix.shard }}" 'NR % 8 == s' all-files.txt > shard-files.txt
          mine=$(wc -l < shard-files.txt)
          echo "shard ${{ matrix.shard }}: $mine of $total source files"
          test "$mine" -gt 0
          # One comma-joined --mutate value: a repeated --mutate flag keeps only the last
          # one, so a shard would have mutated a single file.
          npx stryker run --mutate "$(paste -sd, shard-files.txt)"

      - name: Summarise the shard
        if: always()
        run: |
          node -e '
            const fs = require("node:fs");
            if (!fs.existsSync("reports/mutation.json")) { console.log("no report written"); process.exit(0); }
            const r = JSON.parse(fs.readFileSync("reports/mutation.json", "utf8"));
            const counts = {};
            for (const f of Object.values(r.files)) for (const m of f.mutants) counts[m.status] = (counts[m.status] ?? 0) + 1;
            const killed = (counts.Killed ?? 0) + (counts.Timeout ?? 0);
            const valid = killed + (counts.Survived ?? 0) + (counts.NoCoverage ?? 0);
            const line = "shard ${{ matrix.shard }}: " + JSON.stringify(counts) + " score " + (valid ? (100 * killed / valid).toFixed(1) : "n/a") + "%";
            console.log(line);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + "\n");
          '

      - name: Upload the shard report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-shard-${{ matrix.shard }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            reports/mutation.json
            shard-files.txt
