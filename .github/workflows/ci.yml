name: CI

# THE TESTED ARTIFACT IS NOT THE SHIPPED ARTIFACT. checks and deploy run on separate
# runners and each does its own npm ci, so what ships is a REBUILD of the tested
# commit, not the bytes that passed. foxhound's ci.yml records the same gap. The live
# gate asserts /health reports this exact commit before the run goes green.
#
# Offline checks do not catch the class of outage that motivated the audit: a
# "form-action 'self'" CSP landed in 423bbd6, type-checked, passed every unit test, and
# broke the OAuth consent flow for 26 days. Only scripts/verify-live.mjs catches that:
# the deploy's live gate runs it, and so does the six-hourly check.

on:
  # Both names while master moves to main.
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  # Every six hours. The outage ran 26 days; a six hour ceiling on time-to-detect is
  # the point of the schedule, not the offline checks.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN. Absent, the token's scopes come from the repository
# default, which for this account is read and WRITE on contents. No job here pushes,
# comments, or touches the API: checks runs tsc and node --test, deploy talks to
# Cloudflare with its own secrets, and the live checks talk to a URL.
permissions:
  contents: read

# One run per ref at a time, so two push deploys cannot interleave. On a pull request a
# newer push cancels the older run. On master a run in progress finishes and GitHub keeps
# only the newest waiting run behind it, so a burst of merges ends in a deploy of its
# newest commit: canceling in progress let seven merges in 90 minutes each cancel the
# deploy before it, and none shipped (2026-10-31). Keyed on the event name too, because
# the six-hourly schedule run shares refs/heads/master with push runs and must never
# cancel a deploy mid-flight, nor be canceled by one.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# THIRD PARTY ACTIONS ARE PINNED BY COMMIT SHA, not by tag: a tag is a moving pointer
# its owner can repoint, and these actions run beside the deploy job's secrets. The
# `# v5.x.x` comment keeps Renovate's bumps working.
#
# Nothing here sets continue-on-error, and nothing should.
jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    # Not on the six-hourly schedule: that run tests an unchanged master head, which the
    # push run already tested, and costs about 75s of runner time each time.
    if: github.event_name != 'schedule'
    # Every job has a timeout, roughly four times its observed run
    # (test/workflow-policy.test.ts).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # The no AI trailer check, no-bloat and the Worker bundle size are checks.yml
      # (devkit's pr.yml, one job per pull request).

      # Verified on a fresh clone 2026-08-11: npm ci, npm run check and npm test all
      # succeed with no wrangler.jsonc present, because tsconfig pulls its types from
      # @cloudflare/workers-types rather than from generated bindings. That is why this
      # job needs no config and no secrets.
      # The Watch Floor app (dashboard/) is its own package with its own lockfile, so
      # it installs separately; none of the root gates can see it.
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix dashboard

      # FIVE TYPECHECKS IN ONE STEP. Each config stays separate, and every one runs even
      # when an earlier one fails, so one red run reports all of them.
      #
      # check: src only. check:test: the tests, with node types, which the shipping
      # config must keep rejecting in src/ (node's type stripping checks nothing, so
      # without this a test could stop compiling and still pass). check:integration:
      # the workers-types experimental surface and the `cloudflare:test` module.
      # check:scripts: scripts/. check:dashboard: the Watch Floor app against
      # src/ops-types/. The step's name is on the auto-merge policy's required CI
      # list, so it keeps its old wording.
      - name: Typecheck src, tests, integration tests and the copied scorer script
        run: |
          status=0
          npm run check || status=1
          npm run check:test || status=1
          npm run check:integration || status=1
          npm run check:scripts || status=1
          npm run check:dashboard || status=1
          exit $status

      # THE LINTS. BEFORE Tests on purpose: these steps are not on the auto-merge
      # policy's required list, so a failure here stops the job, and the skipped required
      # Tests step refuses the merge. Lint is the network's shared Oxlint config (type-aware,
      # so after the typechecks); the repo's own lints (test/lint/: dead exports, doc drift)
      # are not part of it.
      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Lint dead exports and doc drift
        run: npm run lint:repo

      # THE RATCHETS (devkit): no raw console.* call in src/ (the baseline in .console.json
      # is 0; server code logs through logEvent), and no applied migration edited, renamed or
      # deleted, nor a later one that drops or renames without a `-- contract:` line
      # (migrations/manifest.json; a new migration adds its hash with
      # `npx devkit-migrations migrations --write`).
      - name: Console, migration, secret and destructive-action ratchets
        run: |
          npm run check:console
          npm run check:migrations
          npm run check:secrets
          npm run check:destructive

      - name: Tests
        run: npm test

      # THE INTEGRATION LAYER: the whole Worker inside workerd, with a real D1 the
      # migrations are applied to, real KV and real R2. A SEPARATE step
      # rather than part of `npm test` because the two suites fail differently: a unit
      # failure is a handler issuing the wrong statement, an integration failure is
      # SQLite, the OAuth provider or the runtime refusing it.
      - name: Integration tests
        run: npm run test:integration

      # The Watch Floor app builds, and stays inside its size budget
      # (devkit-size-budget, dashboard/.size-budget.json, which fails closed on a missing build).
      # The deploy's pre-deploy guard runs the same before every deploy.
      - name: Build the dashboard and hold its size budget
        run: npm run build:dashboard

      # The app in a real browser (dashboard/e2e, Playwright): the build above under
      # dev/serve.ts (the pages rendered as the Worker renders them), the dev mock, and the Worker's page CSP. A Preview click that did
      # nothing live, and pages that scrolled sideways, passed every other step here.
      # Only Chromium is installed; its version is pinned by @playwright/test in
      # dashboard/package-lock.json.
      - name: Install the browser for the app's browser tests
        run: npx --prefix dashboard playwright install chromium

      - name: Browser tests
        run: npm run test:browser

  # THE MCP CONFORMANCE GATE (devkit-conformance, read from .conformance.json; area 11,
  # P2 to P7 and P10): the official suite against the real protocol layer
  # (test/conformance/entry.ts) and the real door with its OAuth provider (src/index.ts)
  # under wrangler dev, each scenario held to its recorded count, then the 401 challenge,
  # CIMD and the /register allowlist. Its own job, beside checks, so it adds no
  # wall-clock time; not on the schedule, for the reason checks is not, and not on a
  # push to master: the merge was checked as a pull request and no deploy needs it
  # (devkit README, "No second run on main").
  conformance:
    name: conformance
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: MCP conformance
        run: npm run check:conformance

  # THE DEPLOY IS DEVKIT'S SHARED worker-deploy.yml, as on every other site: deploy, the live gate, and the rollback of
  # a refused deploy, guarded so a rerun never rolls back a deploy that is no longer live (devkit README, "The shared
  # deploy"). Ordered after checks, so a failing typecheck or test never reaches production. Push to master only: the
  # called workflow would deploy on any default-branch event, the schedule and a manual run included.
  #
  # GRADUAL ROLLOUT (D4): the new version takes 10% of traffic for 10 minutes before the live gate judges it through a
  # version override (Cloudflare-Workers-Version-Overrides; scripts/verify-live.mjs sends it on every request), then
  # the error rates of both versions are compared and it takes all traffic. A refused one goes back to the version it
  # shared traffic with. Each Durable Object (RateLimiter, ToolCallLog) runs one version at a time, assigned by the
  # split, and the two crons follow the split too (Cloudflare Docs, "Gradual deployments", "With Durable Objects").
  # A deploy that adds a Durable Object migration (wrangler.jsonc.example `migrations`) sets gradual-percent to 0 for
  # that deploy: Cloudflare applies a migration only with `wrangler deploy`, and refuses a version upload carrying one.
  #
  # The pre-deploy guard rebuilds wrangler.jsonc (gitignored; scripts/ci-config.mjs resolves every binding by NAME and
  # checks it against the id pinned in scripts/bindings.mjs, so a runner never binds the wrong database), applies the
  # pending migrations that only add (devkit-migrations refuses a drop, rename or row delete with the hand-run
  # command), and builds the Portal into the Worker's assets within its size budget.
  #
  # The live gate runs scripts/verify-live.mjs with EXPECT_SHA. VERIFY_TOKEN is the live-probe agent's key, for gate 8's
  # real MCP call (docs/rollback.md); the verify command gets no Cloudflare secret, so gate 2b (the OAuth KV canary)
  # runs on the scheduled check below instead. A failed install is exit 3, could not run, never a rollback.
  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
    uses: DrDustinEdwards/devkit/.github/workflows/worker-deploy.yml@22893f4b81049f7eeb019864e7e73257b1b7892f # v0.67.0
    with:
      worker-name: capsid-mcp
      health-url: https://mcp.dustinedwards.info/health
      verify-command: >-
        npm ci --ignore-scripts --no-audit --no-fund || exit 3;
        CAPSID_LIVE_PROBE_KEY="$VERIFY_TOKEN" node scripts/verify-live.mjs
      pre-deploy: >-
        (cd dashboard && node "$GITHUB_WORKSPACE/.devkit/bin/deploy-install.mjs") &&
        node scripts/ci-config.mjs &&
        npx devkit-migrations migrations --apply capsid &&
        npm run build:dashboard
      sha-var: BUILD_SHA
      d1-database: capsid
      gradual-percent: 10
      # No preview per pull request (D6): Cloudflare makes no preview URL for a Worker that has a Durable Object.
      preview: false
      # The Portal is server-rendered here, not a sitemap site.
      warm: false
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VERIFY_TOKEN: ${{ secrets.CAPSID_LIVE_PROBE_KEY }}

  # THE SIX-HOURLY LIVE CHECK. The outage that motivated this ran 26 days; a six hour ceiling on time-to-detect is the
  # point. It runs the same scripts/verify-live.mjs against master head, with what the deploy's gate leaves out: the
  # Cloudflare credentials for gate 2b, which reads one long-lived canary record straight out of OAUTH_KV (a missing
  # client and a KV outage are the same error page through /authorize), and gate 1c's backup freshness (a push says
  # nothing about last night's backup). It never deploys and never rolls back.
  scheduled-live:
    name: scheduled live check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # The wait below (20 minutes at most) plus the poll budget (40 x 3s per polling gate) with room for every gate.
    timeout-minutes: 40
    runs-on: ubuntu-latest
    # actions: read is for the wait below, which lists this workflow's push runs.
    permissions:
      contents: read
      actions: read
    steps:
      # A PUSH DEPLOY STILL IN FLIGHT IS WAITED FOR. On 2026-11-01 the 05:57Z run expected 33ca891 while its push run
      # was still deploying it (live stayed at 4b0bba1 until 06:05Z), gave up after 41 polls and turned master red. So
      # this waits until no push run on its branch is unfinished, then expects the branch head as it stands, which
      # still catches a master head that never went live.
      - name: Wait for a push deploy still running
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            busy=$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?branch=${BRANCH}&event=push&per_page=20" --jq '[.workflow_runs[] | select(.status != "completed")] | length')
            if [ "$busy" = "0" ]; then
              echo "sha=$(gh api "repos/${REPO}/commits/${BRANCH}" --jq .sha)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "${busy} push run(s) on ${BRANCH} still running; waiting"
            sleep 20
          done
          # That push run's own live gate asserts the head it deploys, so this run has nothing it would add;
          # failing here only turned master red for a deploy that was still in flight (3 of 3, 2026-11-11..13).
          echo "::warning::a push run on ${BRANCH} was still running after 20 minutes; its own live gate covers the head, so this check is skipped"
          echo "skip=true" >> "$GITHUB_OUTPUT"

      - if: steps.head.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: steps.head.outputs.skip != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # verify-live grades headers with site-runtime's checkSecurityHeaders, so it installs from the lockfile, with no
      # install scripts.
      - name: Install dependencies
        if: steps.head.outputs.skip != 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: verify:live
        if: steps.head.outputs.skip != 'true'
        env:
          EXPECT_SHA: ${{ steps.head.outputs.sha }}
          VERIFY_POLL_ATTEMPTS: "40"
          ASSERT_BACKUP_FRESH: "1"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CAPSID_LIVE_PROBE_KEY: ${{ secrets.CAPSID_LIVE_PROBE_KEY }}
        run: npm run verify:live
