name: CI

# THE TESTED ARTIFACT IS NOT THE SHIPPED ARTIFACT. checks and deploy run on separate
# runners and each does its own npm ci, so what ships is a REBUILD of the tested
# commit, not the bytes that passed. Closing this means uploading the build from checks
# and downloading it in deploy. foxhound's ci.yml records the same gap.
#
# Two mitigations stand: the runner checks out clean, so BUILD_DIRTY=false means
# something, and the live job asserts /health reports this exact commit before the run
# goes green.
#
# Offline checks do not catch the class of outage that motivated the audit: a
# "form-action 'self'" CSP landed in 423bbd6, type-checked, passed every unit test, and
# broke the OAuth consent flow for 26 days. Only scripts/verify-live.mjs catches that,
# and it already existed with nothing invoking it.

on:
  # Both names while master moves to main.
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  # Every six hours. The outage ran 26 days; a six hour ceiling on time-to-detect is
  # the point of the schedule, not the offline checks.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN. Absent, the token's scopes come from the repository
# default, which for this account is read and WRITE on contents. No job here pushes,
# comments, or touches the API: checks runs tsc and node --test, deploy talks to
# Cloudflare with its own secrets, and the live gate talks to a URL.
permissions:
  contents: read

# Rapid pushes supersede each other: a newer run on the same ref cancels the older one,
# so two push deploys cannot interleave. Keyed on the event name too, because the
# six-hourly schedule run shares refs/heads/master with push runs and must never cancel
# a deploy mid-flight, nor be canceled by one.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# THIRD PARTY ACTIONS ARE PINNED BY COMMIT SHA, not by tag: a tag is a moving pointer
# its owner can repoint, and these actions run beside the deploy job's secrets. The
# `# v5.x.x` comment keeps Renovate's bumps working.
#
# Nothing here sets continue-on-error, and nothing should.
jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    # Not on the six-hourly schedule: that run tests an unchanged master head, which the
    # push run already tested, and costs about 75s of runner time each time. The live
    # job needs checks only for ordering, and its condition runs it when checks is
    # skipped (see the live job).
    if: github.event_name != 'schedule'
    # Every job has a timeout, roughly four times its observed run
    # (test/workflow-policy.test.ts).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # The no AI trailer check is ai-author.yml (devkit's reusable workflow), and the
      # no-bloat report is no-bloat.yml.

      # Verified on a fresh clone 2026-08-11: npm ci, npm run check and npm test all
      # succeed with no wrangler.jsonc present, because tsconfig pulls its types from
      # @cloudflare/workers-types rather than from generated bindings. That is why this
      # job needs no config and no secrets.
      # The Watch Floor app (dashboard/) is its own package with its own lockfile, so
      # it installs separately; none of the root gates can see it.
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix dashboard

      # A high advisory in what the Worker or the app ships fails the run (Grok audit
      # 2026-10-21, CA-12). Dev-only advisories are Renovate's.
      - name: No high advisory in the shipped dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --omit=dev --audit-level=high --prefix dashboard

      # FIVE TYPECHECKS IN ONE STEP. Each config stays separate, and every one runs even
      # when an earlier one fails, so one red run reports all of them.
      #
      # check: src only. check:test: the tests, with node types, which the shipping
      # config must keep rejecting in src/ (node's type stripping checks nothing, so
      # without this a test could stop compiling and still pass). check:integration:
      # the workers-types experimental surface and the `cloudflare:test` module.
      # check:scripts: scripts/. check:dashboard: the Watch Floor app against
      # src/ops-types/. The step's name is on the auto-merge policy's required CI
      # list, so it keeps its old wording.
      - name: Typecheck src, tests, integration tests and the copied scorer script
        run: |
          status=0
          npm run check || status=1
          npm run check:test || status=1
          npm run check:integration || status=1
          npm run check:scripts || status=1
          npm run check:dashboard || status=1
          exit $status

      # THE LINTS (test/lint/: dead exports, doc drift, oxlint). BEFORE Tests on
      # purpose: this step is not on the auto-merge policy's required list, so a failure
      # here stops the job, and the skipped required Tests step refuses the merge.
      - name: Lint dead exports and doc drift
        run: npm run lint

      - name: Tests
        run: npm test

      # THE INTEGRATION LAYER: the whole Worker inside workerd, with a real D1 the
      # migrations are applied to, real KV and real R2. A SEPARATE step
      # rather than part of `npm test` because the two suites fail differently: a unit
      # failure is a handler issuing the wrong statement, an integration failure is
      # SQLite, the OAuth provider or the runtime refusing it.
      - name: Integration tests
        run: npm run test:integration

      # The Watch Floor app builds, and stays inside its size budget
      # (dashboard/scripts/size-budget.mjs, which fails closed on a missing build).
      # scripts/deploy.mjs runs the same two before every deploy.
      - name: Build the dashboard and hold its size budget
        run: npm run build:dashboard

      # The app in a real browser (dashboard/e2e, Playwright): the build above under
      # vite preview, the dev mock, and the Worker's page CSP. A Preview click that did
      # nothing live, and pages that scrolled sideways, passed every other step here.
      # Only Chromium is installed; its version is pinned by @playwright/test in
      # dashboard/package-lock.json.
      - name: Install the browser for the app's browser tests
        run: npx --prefix dashboard playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:browser

  # Ordered after checks: a failing typecheck or test never reaches production. No
  # continue-on-error, and deliberately no `if: secrets.X != ''` guard. A job that skips
  # when its credentials are missing makes "deployed" and "could not deploy"
  # indistinguishable.
  # If the secrets are absent this job fails loudly.
  deploy:
    name: deploy
    needs: checks
    timeout-minutes: 15
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # Which attempt of the run did the deploying. A rerun of the live job alone keeps
    # this job's outputs from the earlier attempt, so the rollback step can tell a rerun
    # from the attempt that shipped (scripts/rollback-guard.mjs).
    outputs:
      attempt: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # dashboard/ is built by scripts/deploy.mjs into the Worker's static assets, so the
      # deploy job installs it too.
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix dashboard

      # wrangler.jsonc is gitignored, so a runner has no deployable config.
      # scripts/ci-config.mjs rebuilds it: every binding is resolved by NAME against the
      # account, then checked against an id pinned in the script, and any disagreement is
      # a hard failure. Resolving by name alone would silently rebind this Worker to the
      # wrong database.
      - name: Reconstruct wrangler.jsonc
        run: node scripts/ci-config.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Refuse to ship code against a database missing a migration. Migrations are
      # applied by hand (README), so a commit that adds migrations/000N and pushes would
      # otherwise deploy a Worker whose SQL assumes a table the live D1 lacks. wrangler
      # prints "No migrations to apply!" when the remote is current and exits 0 either
      # way, so the confirmation string is the signal. Fails closed: an unreadable or
      # unexpected output is a missing confirmation and stops the deploy.
      - name: Assert all migrations are applied
        run: |
          set -euo pipefail
          OUT=$(npx wrangler d1 migrations list capsid --remote 2>&1)
          echo "$OUT"
          if ! echo "$OUT" | grep -q "No migrations to apply"; then
            echo "::error::the live database is missing migrations; apply them with 'wrangler d1 migrations apply capsid --remote' before this deploy" >&2
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  live:
    name: live gate
    needs: [checks, deploy]
    # Above the poll budget (40 x 3s per polling gate) with room for every gate.
    timeout-minutes: 15
    # Never on pull_request. A PR head sha is not deployed, so asserting anything about
    # production from one is meaningless.
    #
    # !failure() && !cancelled() rather than always(): on a schedule run the checks and
    # deploy jobs are SKIPPED, and a plain `needs:` would skip this job too, retiring the
    # six-hourly check. This form runs when a dependency was skipped but not when one
    # failed.
    if: github.event_name != 'pull_request' && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc

      # No npm ci on purpose: scripts/verify-live.mjs imports nothing outside the Node
      # standard library and runs on global fetch. Keeping it dependency-free is what
      # lets the live gate run even if install is broken. The rollback step installs
      # from the lockfile itself, only when it is about to roll back.

      # EXPECT_SHA is this run's commit when deploy succeeded, and master head on a
      # schedule run. Empty otherwise: the ternary below is the behavior.
      #
      # EXIT 1 IS A REFUSAL, EXIT 3 IS "COULD NOT RUN". A gate whose requests never got
      # an answer (a reset connection, a timeout) has not refused the deploy; on
      # 2026-09-18 one ECONNRESET rolled back a good deploy. The exit code is recorded
      # so the rollback below runs on a refusal only. Exit 3 still fails the job.
      - name: verify:live
        id: verify
        env:
          EXPECT_SHA: ${{ (needs.deploy.result == 'success' || github.event_name == 'schedule') && github.sha || '' }}
          VERIFY_POLL_ATTEMPTS: "40"
          # GATE 1c ASSERTS BACKUP FRESHNESS ON THE SCHEDULED RUN ONLY (residual 7).
          # /health has reported backup.last_ok since 2026-09-07 and nothing read it. A
          # push runs minutes after a deploy and says nothing about last night's backup;
          # the six-hourly schedule bounds this at six hours. Off, the gate reports
          # SKIPPED and says what it did not assert.
          ASSERT_BACKUP_FRESH: ${{ github.event_name == 'schedule' && '1' || '0' }}
          # Gate 2b READS one long-lived canary record straight out of OAUTH_KV. It reads
          # KV rather than asking the Worker because a missing client and a KV outage are
          # the same error page through /authorize. Without these the gate SKIPS and says
          # so; it never passes quietly.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Gate 8 makes a real MCP call through /ops/mcp (initialize or server/discover,
          # tools/list, one read) as the live-probe agent: read grant on capsid, the read
          # tool only (scripts/mint-agents.ts). A broken connection refuses (exit 1), so
          # the step below rolls the deploy back. Without the secret the gate SKIPS, says
          # so, and warns.
          CAPSID_LIVE_PROBE_KEY: ${{ secrets.CAPSID_LIVE_PROBE_KEY }}
        run: |
          set +e
          npm run verify:live
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          if [ "$code" = "3" ]; then
            echo "::error::the live gate could not run (no answer from the Worker). No gate refused this deploy, so it is not rolled back. Rerun the live job."
          fi
          exit "$code"

      # Only if this run's deploy succeeded, then the gate REFUSED it (exit 1). A
      # scheduled run skipping deploy must not roll back a live sha that is merely
      # behind, and a gate that could not run (exit 3) has not refused anything.
      - name: Roll back the deploy this run shipped
        if: failure() && needs.deploy.result == 'success' && steps.verify.outputs.exit_code == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_ATTEMPT: ${{ needs.deploy.outputs.attempt }}
        run: |
          set -euo pipefail
          HEALTH_URL=https://mcp.dustinedwards.info/health
          # No -f on curl and no abort on its failure: a /health that answers 5xx, or
          # not at all, must reach the guard as "unreadable" rather than end this step
          # before it decides anything.
          live_sha() {
            { curl -sS --max-time 10 "$HEALTH_URL" || true; } | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).sha??"unknown")}catch{process.stdout.write("unreadable")}})'
          }
          ROLLBACK_FROM=$(live_sha)
          # ROLL BACK ONLY WHAT THIS RUN PUT LIVE. `needs.deploy.result` survives a
          # rerun of just this job, so the `if:` above is true on a rerun whose deploy
          # happened in an earlier attempt and has already been rolled back. On
          # 2026-09-18 that ran the rollback a second time and "the previous version"
          # was the refused commit, moving production forward onto it. The guard
          # compares what is live NOW against this run's own commit, and when /health
          # cannot say, rolls back only if the deploy happened in this attempt.
          if ! node scripts/rollback-guard.mjs "${ROLLBACK_FROM}" "${GITHUB_SHA}" "${DEPLOY_ATTEMPT}" "${GITHUB_RUN_ATTEMPT}"; then
            echo "::error::not rolling back. master and production may disagree; a human decides."
            echo "rollback_skipped: live=${ROLLBACK_FROM} this_run=${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::warning::the live gate failed against ${ROLLBACK_FROM}; rolling back to the previous version"
          # The lockfile's wrangler, not npx: npx resolves wrangler's own dependency
          # ranges at job time, next to the deploy token. No install scripts run, and the
          # rollback is an API call that needs none (Grok audit 2026-10, U3).
          npm ci --ignore-scripts --no-audit --no-fund
          node_modules/.bin/wrangler rollback --name capsid-mcp --message "live gate failed for ${GITHUB_SHA}" --yes
          # The rollout is not instant, so read the sha back rather than assuming, and
          # say so when it never moved.
          ROLLBACK_TO=unreadable
          for _ in $(seq 1 20); do
            ROLLBACK_TO=$(live_sha)
            if node scripts/rollback-guard.mjs --after "${ROLLBACK_TO}" "${GITHUB_SHA}" > /dev/null; then
              echo "::error::rolled back: was ${ROLLBACK_FROM} (this run's commit ${GITHUB_SHA}), now ${ROLLBACK_TO}. master still points at the bad commit; land a fix or revert it."
              echo "rollback_from=${ROLLBACK_FROM} rollback_to=${ROLLBACK_TO}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 3
          done
          echo "::error::the rollback did not take effect: /health still reports ${ROLLBACK_TO} after 20 reads (this run's commit ${GITHUB_SHA}). Production may still be serving the refused deploy; a human decides."
          echo "rollback_did_not_take_effect: from=${ROLLBACK_FROM} now=${ROLLBACK_TO}" >> "$GITHUB_STEP_SUMMARY"
          exit 1

