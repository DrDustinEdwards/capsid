name: shadow-test

# THE SHADOW TEST (docs/work-queue.md, "The shadow test"; scripts/shadow-test.mjs,
# src/shadow.ts). On a pull request that names its job, a model reads the job and the
# base, never the diff, and writes one test of what the job asks; it runs on the base and
# on the head, and Capsid records both. It blocks nothing: the script always exits 0, and
# complete's CI gate does not wait on this check.
#
# On your Claude subscription, not an API key: the repository secret CLAUDE_CODE_OAUTH_TOKEN
# comes from `claude setup-token`. Capsid is reached with this workflow's OIDC token, so
# no Capsid key is stored. Same-repository pull requests only: a fork gets neither.

on:
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: shadow-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Holds an OIDC token, so it runs the base's code only: the checkout is the base, and
  # the model is confined to an unpacked copy of it. Capsid refuses a run whose copy of
  # this file is not the default branch's (src/shadow.ts), so a pull request cannot move
  # the head's code into a job that holds a token.
  shadow-test:
    permissions:
      contents: read
      id-token: write
    name: shadow-test
    if: github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.body, 'job_')
    runs-on: ubuntu-latest
    # A model turn budget of 40 plus an npm install and a test run.
    timeout-minutes: 40
    outputs:
      test: ${{ steps.write.outputs.test }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Claude Code
        run: curl -fsSL https://claude.ai/install.sh | bash

      - name: Write the shadow test and run it on the base
        id: write
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: PATH="$HOME/.local/bin:$PATH" node scripts/shadow-test.mjs write

  # The head's code, with no OIDC token: nothing here can reach Capsid. The result it
  # reports is the head's word, as it always was: the head's code is what is under test.
  shadow-head:
    needs: shadow-test
    if: needs.shadow-test.outputs.test != ''
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      head: ${{ steps.run.outputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the shadow test on the head
        id: run
        env:
          SHADOW_TEST: ${{ needs.shadow-test.outputs.test }}
        run: node scripts/shadow-test.mjs head

  # Holds an OIDC token again, on the base's code, to record both results and the test.
  shadow-report:
    needs: [shadow-test, shadow-head]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record the results
        env:
          SHADOW_TEST: ${{ needs.shadow-test.outputs.test }}
          SHADOW_HEAD: ${{ needs.shadow-head.outputs.head }}
        run: node scripts/shadow-test.mjs report
