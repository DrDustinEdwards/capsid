name: Explorer

# capsid.dustinedwards.info, the system explorer (explorer/README.md): prerendered pages from
# Capsid's public model and numbers, served by an assets-only Worker of its own
# (capsid/rulings/system-explorer-2026-10-10.md, answers 4 and 8).
#
# A pull request that touches the explorer, or Capsid's src/ its build loads, is checked from
# the fixtures: typecheck, the build tests and the browser spec. On master, daily and by hand,
# the deploy job builds from the live documents and deploys only when the build differs from
# what capsid.dustinedwards.info serves (build.json's content hash): a new day's numbers or new
# explorer code. A day the public build did not run deploys nothing. The deploy is devkit's shared
# worker-deploy: live gate on /health, rollback on a refusal.

on:
  pull_request:
    branches: [master, main]
    # The build loads Capsid's schemas and, for the tool catalog, every tool registration
    # (explorer/src/surface.mjs), which between them reach most of src/.
    paths:
      - "explorer/**"
      - "src/**"
      - "test/resolve-ts.mjs"
      - "package-lock.json"
      - ".github/workflows/explorer.yml"
  # The explorer's own files only. A schema change reaches it at the next daily build: the
  # live documents keep their old shape until the public build runs again after midnight UTC,
  # so a deploy on that merge would parse yesterday's documents with today's schemas.
  push:
    branches: [master, main]
    paths:
      - "explorer/**"
      - ".github/workflows/explorer.yml"
  # Hours after the public build, which runs on the first tick of each UTC day (src/public-data.ts).
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: master's pushes, schedule and dispatches queue behind each other and never
# cancel a deploy mid-flight; a pull request's newer push cancels its older run.
concurrency:
  group: explorer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions pinned by commit sha, as in ci.yml (the same two, the same shas).
jobs:
  # Not on the daily schedule, which only brings new numbers: the code it would test has not
  # changed since the push that ran it. The build's schema check still guards the new data.
  checks:
    name: explorer checks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            explorer/package-lock.json

      # The root install brings zod for Capsid's schemas, TypeScript and wrangler.
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix explorer

      - name: Typecheck
        run: npm --prefix explorer run check

      - name: Build tests
        run: npm --prefix explorer test

      - name: Install the browser
        run: npx --prefix explorer playwright install --with-deps chromium

      # Served by wrangler dev with the deploy's own config and _headers (explorer/playwright.config.mjs).
      - name: Browser spec
        run: npm --prefix explorer run e2e

  # Turned on by the repository variable EXPLORER_DEPLOY=on, which Dustin sets once his two
  # account steps are done (ruling answer 13: the deploy token as the EXPLORER_CLOUDFLARE_API_TOKEN
  # secret, and capsid.dustinedwards.info). That is a switch, not a guard on the secrets: with it
  # on, a missing or wrong token fails the deploy loudly, as ci.yml's deploy does.
  #
  # This job builds from the live documents and says whether the build differs from what is live;
  # the deploy below ships it only then.
  compare:
    name: explorer compare
    needs: checks
    if: >-
      always() && (needs.checks.result == 'success' || (github.event_name == 'schedule' && needs.checks.result == 'skipped'))
      && github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
      && vars.EXPLORER_DEPLOY == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy: ${{ steps.compare.outputs.deploy }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            explorer/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix explorer

      # The live documents, checked against Capsid's schemas before a page is written
      # (explorer/build.mjs). A 503 before the first public build fails here.
      - name: Build from the live documents
        run: npm --prefix explorer run build

      - name: Compare with what is live
        id: compare
        run: |
          set -euo pipefail
          built=$(node -p 'require("./explorer/dist/build.json").content')
          # Before the first deploy there is no live build.json; anything but a JSON answer
          # with a hash counts as different.
          live=$(curl -fsS --max-time 20 https://capsid.dustinedwards.info/build.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).content' 2>/dev/null || echo none)
          echo "built $built, live $live"
          if [ "$built" = "$live" ]; then
            echo "::notice::the explorer is already serving this build; nothing to deploy"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  # devkit's shared deploy (worker-deploy.yml), as on the sites: it builds again from the live
  # documents, writes the generated config (never committed: CLAUDE.md, public repo rule) where
  # wrangler finds it, deploys with DEPLOY_SHA set to this commit, waits for /health
  # (explorer/worker.mjs) to report it, checks the home page answers, and rolls the deploy back if
  # it does not. It runs in explorer/, so the generated wrangler.json there is the config.
  deploy:
    name: explorer deploy
    needs: compare
    if: always() && needs.compare.result == 'success' && needs.compare.outputs.deploy == 'true'
    concurrency:
      group: explorer-deploy
      cancel-in-progress: false
    uses: DrDustinEdwards/devkit/.github/workflows/worker-deploy.yml@454002f526e5e8e645a9c110605880e220b611a0 # v0.21.0
    with:
      worker-name: capsid
      health-url: https://capsid.dustinedwards.info/health
      verify-command: >-
        code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://capsid.dustinedwards.info/ || true);
        echo "home page answered $code";
        if [ "$code" = 200 ]; then exit 0; elif [ "$code" = 000 ]; then exit 3; else exit 1; fi
      working-directory: explorer
      install: cd .. && npm ci && npm ci --prefix explorer
      pre-deploy: >-
        cd .. && npm --prefix explorer run build &&
        node explorer/wrangler-config.mjs explorer/dist > explorer/wrangler.json
      sha-var: DEPLOY_SHA
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.EXPLORER_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Tell IndexNow the pages changed (explorer/indexnow.mjs, Prelum's submitIndexNow), once the
  # live gate passes. A refused or failed ping is a warning, never a failure: the engines then
  # crawl on their own.
  indexnow:
    name: explorer indexnow
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            explorer/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix explorer

      # indexnow.mjs reads dist/sitemap.xml: the live one is what was just deployed.
      - name: Tell IndexNow
        run: |
          mkdir -p explorer/dist
          curl -fsS --max-time 20 https://capsid.dustinedwards.info/sitemap.xml -o explorer/dist/sitemap.xml
          npm --prefix explorer run indexnow
