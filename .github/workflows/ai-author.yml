name: ai-author

# No AI attribution (Dustin). Fails when a commit this push or pull request adds
# carries a trailer or footer naming Claude, and on a pull request a commit authored or
# committed as Claude. Older commits are not checked (no history rewrite, ruled
# 2026-09-25). pr-footer.yml holds the same rule for pull request descriptions.
#
# devkit's reusable workflow, pinned by full sha like any action
# (test/workflow-policy.test.ts); it declares its own timeout.

on:
  # Both names while master moves to main, as in ci.yml.
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  ai-author:
    uses: DrDustinEdwards/devkit/.github/workflows/ai-author.yml@6f4c67e69cc34285f2bdc63a1883912dc7f0c06e # v0.9.0

