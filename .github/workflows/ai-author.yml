name: ai-author

# No AI attribution (Dustin). Fails when a commit this push or pull request adds
# carries Co-Authored-By naming Claude, "Generated with Claude Code", a Claude-Session
# link or any other trailer naming Claude, and on a pull request a commit authored or
# committed as Claude. Older commits are not checked (no history rewrite, ruled
# 2026-09-25). This was a step of ci.yml running scripts/check-commit-trailers.mjs; the
# same check is now devkit's reusable workflow and its devkit-check-trailers bin
# (capsid/research/design-shared-tests.md, section 3), run from the devkit tag
# package.json pins.
#
# The pr-footer job is the same rule for pull request descriptions: a cloud session's
# GitHub connection appends a "Generated by Claude Code" footer to every description it
# writes and puts it back when the session removes it, so this job removes it
# (scripts/strip-pr-footer.mjs; Dustin, 2026-10-14). Run it by hand to clean every past
# pull request.
#
# The sha is devkit's v0.6.0 commit. A reusable workflow is pinned by full sha like any
# action (test/workflow-policy.test.ts), and it declares its own timeout.

on:
  # Both names while master moves to main, as in ci.yml.
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-author:
    # A description edit or a hand run changes no commit.
    if: github.event_name != 'workflow_dispatch' && github.event.action != 'edited'
    uses: DrDustinEdwards/devkit/.github/workflows/ai-author.yml@491b6cc552a80cdfcb4c0b5184e51682f907eda3 # v0.6.0

  pr-footer:
    # Only this repo's own pull requests: a fork's token cannot write the description.
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'synchronize')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: scripts/strip-pr-footer.mjs
          sparse-checkout-cone-mode: false
      - name: Remove the footer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/strip-pr-footer.mjs
