name: worker-size

# The Worker bundle size budget (devkit's reusable workflow and its devkit-worker-size bin):
# `wrangler deploy --dry-run` against .worker-size.json, raw and gzip, set about 10% above the
# measured Total Upload. Over budget fails the run. The dry run reads wrangler.dryrun.jsonc, which
# scripts/dry-run-config.mjs builds offline from wrangler.jsonc.example, so no secret is needed.
# The dashboard's own size budget stays in ci.yml's dashboard build step.
# The Worker renders the Portal's pages (dashboard/build/worker/portal.js, bundled in through the
# capsid-portal-pages alias), so the dashboard is built first. Raised on 2026-11-03 from 1872 KiB raw
# and 540 KiB gzip to 2885 and 850 (Dustin: the Portal rendered on the server like the network's other
# sites): the pages bring React's server renderer, React Router and the views, 2621.7 KiB and 771.4 KiB.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: worker-size-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  worker-size:
    uses: DrDustinEdwards/devkit/.github/workflows/worker-size.yml@0c1b0a6aa70b7991888cc2d5686af6e8a8e28f3d # v0.21.3
    with:
      prepare: npm ci --prefix dashboard && npm --prefix dashboard run build && node scripts/dry-run-config.mjs
